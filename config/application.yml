nacos:
  config:
    type: yaml #配置集的配置格式
    server-addr: 192.168.44.12:8848 #配置中心地址
    namespace: dev #命名空间
    data-id: galaxy-report-service-local # 数据集ID
    auto-refresh: true #开启自动刷新
    group: Galaxy  #配置对应的分组
    username: nacos #Nacos认证用户
    password: nacos #Nacos认证密码
    bootstrap:
      enable: true #开启配置预加载功能
      log:
        enable: true #开启Nacos支持日志级别的加载时机
spring:
  profiles:
    active: dev
logging:
  config: ./config/log4j2-dev.xml